spring.application.name=gestion-guias

server.port=8080

app.efs.path=./efs/guias
aws.s3.bucket=guias-despacho-lucas-2026
aws.region=us-east-1

# Seguridad JWT local temporal para pruebas mientras se habilita Azure AD B2C.
# En la entrega final se reemplaza por el issuer-uri real de Azure AD B2C.
app.security.jwt.local-secret=01234567890123456789012345678901
# RabbitMQ
# En local usa localhost; dentro de Docker se podrá reemplazar por RABBITMQ_HOST=rabbitmq.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}

# Confirma que RabbitMQ recibió los mensajes y detecta rutas inexistentes.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Los mensajes rechazados no vuelven infinitamente a la cola principal.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
